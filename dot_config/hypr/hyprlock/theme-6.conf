$CLOCK_FONT = Inter Variable
$FONT = Inter Variable
$MONOSPACE_FONT = CaskaydiaCove Nerd Font Propo

animations {
  animation = fadeIn, 1, 10
  animation = fadeOut, 1, 10
}

background {
  path = $BACKGROUND_PATH
  color = $primary_container
  blur_passes = 0
  blur_size = 0
}

# --- Main container --- #

shape {
  size = 400, 140
  color = $primary_container
  shadow_passes = 1
  shadow_size = 6
  shadow_color = $shadow
  shadow_boost = 0.75
  position = 30, 30
  border_size = 0
  border_color = $outline_variant
  halign = left
  valign = bottom
  rounding = 24
  zindex = 2
}

# --- User image --- #

image {
  shadow_passes = 1
  shadow_size = 3
  shadow_color = $shadow
  shadow_boost = 0.75
  path = $PROFILE_IMAGE
  reload_cmd = $SCRIPTS_PATH/user-picture.sh
  reload_time = 1
  border_size = 0
  border_color = $primary
  size = 120
  halign = left
  valign = bottom
  position = 40, 40
  rounding = 14
  zindex = 3
}

# --- User label --- #

label {
  color = $on_primary_container
  shadow_passes = 0
  shadow_size = 2
  shadow_color = $shadow
  shadow_boost = 1.2
  text = cmd[update:0] $SCRIPTS_PATH/truncate.sh "$USER" 12
  font_size = 20
  font_family = $FONT Bold
  halign = left
  valign = bottom
  position = 180, 120
  zindex = 3
}

label {
  color = $secondary
  shadow_passes = 0
  shadow_size = 2
  shadow_color = $shadow
  shadow_boost = 1.2
  text = cmd[update:0] $SCRIPTS_PATH/truncate.sh "$(cat /etc/hostname)" 15
  font_size = 14
  font_family = $FONT
  halign = left
  valign = bottom
  position = 180, 100
  zindex = 3
}

# --- Input field --- #

input-field {
  size = 225, 30
  outline_thickness = 2
  dots_size = 0.25
  dots_spacing = 0.4
  dots_center = false
  dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
  outer_color = $primary
  inner_color = $primary
  font_color = $on_primary
  font_family = $FONT
  fade_on_empty = false
  fade_timeout = 2000
  placeholder_text = Enter password # Text rendered in the input box when it's empty.
  hide_input = false
  rounding = -1 # -1 means complete rounding (circle/oval)
  check_color = $on_primary
  check_text = Authenticating...
  fail_color = $error_container # if authentication failed, changes outer_color and fail message color
  fail_text = <b>$FAIL ($ATTEMPTS)</b> # can be set to empty
  fail_transition = 200 # transition time in ms between normal outer_color and fail_color
  capslock_color = $tertiary
  numlock_color = $primary
  bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
  invert_numlock = false # change color if numlock is off
  swap_font_color = false
  position = 180, 50
  halign = left
  valign = bottom
  shadow_passes = 0
  shadow_size = 2
  shadow_color = $shadow
  shadow_boost = 0.75
  zindex = 4
}

