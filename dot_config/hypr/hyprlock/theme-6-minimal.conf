$CLOCK_FONT = Inter Variable
$FONT = Inter Variable
$MONOSPACE_FONT = CaskaydiaCove Nerd Font Propo

animations {
  animation = fadeIn, 1, 10
  animation = fadeOut, 1, 10
}

background {
  path = $BACKGROUND_PATH
  color = $primary_container
  blur_passes = 0
  blur_size = 0
}

# --- Main container --- #

shape {
  size = 350, 80
  color = $surface
  shadow_passes = 1
  shadow_size = 6
  shadow_color = $shadow
  shadow_boost = 0.75
  position = 0, 100
  border_size = 2
  border_color = $outline_variant
  halign = center
  valign = bottom
  rounding = 15
  zindex = 2
}

shape {
  size = 62, 62
  color = $primary
  shadow_passes = 1
  shadow_size = 2
  shadow_color = $shadow
  shadow_boost = 0.75
  position = -135, 110
  border_size = 0
  border_color = $outline_variant
  halign = center
  valign = bottom
  rounding = -1
  zindex = 3
}

# --- User image --- #

image {
  shadow_passes = 0
  shadow_size = 2
  shadow_color = $shadow
  shadow_boost = 0.5
  path = $PROFILE_IMAGE
  reload_cmd = $SCRIPTS_PATH/user-picture.sh
  reload_time = 1
  border_size = 0
  border_color = $primary
  size = 60
  halign = center
  valign = bottom
  position = -135, 110
  rounding = -1
  zindex = 4
}

# --- Divider --- #

shape {
  size = 2, 70
  color = $outline_variant
  shadow_passes = 0
  shadow_size = 2
  shadow_color = $shadow
  shadow_boost = 0.75
  position = -90, 106
  border_size = 0
  border_color = $outline_variant
  halign = center
  valign = bottom
  rounding = -1
  zindex = 3
}

# --- User label --- #

label {
  color = $primary
  shadow_passes = 0
  shadow_size = 2
  shadow_color = $shadow
  shadow_boost = 1.2
  text = cmd[update:0] $SCRIPTS_PATH/truncate.sh "$USER" 12
  font_size = 14
  font_family = $FONT
  halign = center
  valign = bottom
  position = 45, 150
  zindex = 3
}


# --- Input field --- #

input-field {
  size = 240, 30
  outline_thickness = 1
  dots_size = 0.25
  dots_spacing = 0.4
  dots_center = true
  dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
  outer_color = $outline_variant
  inner_color = $primary_container
  font_color = $on_primary_container
  font_family = $FONT
  fade_on_empty = false
  fade_timeout = 2000
  placeholder_text = Enter password # Text rendered in the input box when it's empty.
  hide_input = false
  rounding = 5 # -1 means complete rounding (circle/oval)
  check_color = $primary
  check_text = Authenticating...
  fail_color = $error # if authentication failed, changes outer_color and fail message color
  fail_text = <b>$FAIL ($ATTEMPTS)</b> # can be set to empty
  fail_transition = 200 # transition time in ms between normal outer_color and fail_color
  capslock_color = $tertiary
  numlock_color = $outline_variant
  bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
  invert_numlock = false # change color if numlock is off
  swap_font_color = false
  position = 45, 110
  halign = center
  valign = bottom
  shadow_passes = 0
  shadow_size = 2
  shadow_color = $shadow
  shadow_boost = 0.75
  zindex = 4
}

# --- Lock icon --- #

shape {
  size = 75, 75
  color = $primary
  shadow_passes = 0
  shadow_size = 6
  shadow_color = $shadow
  shadow_boost = 0.75
  position = 0, -100
  border_size = 0
  border_color = $outline_variant
  halign = center
  valign = top
  rounding = 6
  zindex = 3
  rotate = 15
}

shape {
  size = 75, 75
  color = $primary
  shadow_passes = 0
  shadow_size = 6
  shadow_color = $shadow
  shadow_boost = 0.75
  position = 0, -94
  border_size = 0
  border_color = $outline_variant
  halign = center
  valign = top
  rounding = 6
  zindex = 3
  rotate = 45
}

shape {
  size = 75, 75
  color = $primary
  shadow_passes = 0
  shadow_size = 6
  shadow_color = $shadow
  shadow_boost = 0.75
  position = 0, -100
  border_size = 0
  border_color = $outline_variant
  halign = center
  valign = top
  rounding = 6
  zindex = 3
  rotate = 75
}

shape {
  size = 70, 70
  color = $primary
  shadow_passes = 2
  shadow_size = 5
  shadow_color = $shadow
  shadow_boost = 2.0
  position = 0, -112
  border_size = 0
  border_color = $outline_variant
  halign = center
  valign = top
  rounding = -1
  zindex = 2
}

label {
  text = 󰌾
  color = $on_primary
  shadow_passes = 0
  shadow_size = 1
  shadow_color = $shadow
  shadow_boost = 1.2
  font_size = 45
  font_family = $MONOSPACE_FONT
  position = 0, -111
  halign = center
  valign = top
  zindex = 4
}

# --- Greeting label --- #

label {
  text = cmd[update:60000] echo "Good "$(if [ $(date +%-H) -lt 12 ]; then echo "morning"; elif [ $(date +%-H) -lt 18 ]; then echo "afternoon"; else echo "evening"; fi)""
  color = $on_surface_variant_dark
  shadow_passes = 1
  shadow_size = 1
  shadow_color = $shadow
  shadow_boost = 1.0
  font_size = 20
  font_family = $FONT
  position = 0, -250
  halign = center
  valign = top
  zindex = 4
}

# --- Time label --- #

label {
  color = $on_surface_dark
  shadow_passes = 1
  shadow_size = 2
  shadow_color = $shadow
  shadow_boost = 1.0
  text = <span font_features='-tnum'>$TIME</span>
  font_size = 80
  font_family = $CLOCK_FONT
  halign = center
  valign = top
  position = 0, -275
  zindex = 4
}
