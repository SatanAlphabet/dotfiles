{{- /* chezmoi:modify-template */ -}}
{{- $settings := fromIni .chezmoi.stdin -}}
{{- if $settings -}}
{{- /* chezmoi has problems pulling the color value, so it's set to a fallback value (the color isn't really used anyways) */ -}}
{{- $settings = $settings | setValueAtPath "Settings.color" "#ffffff" -}}
{{- $settings = $settings | setValueAtPath "Settings.post_command" "wallswitch.sh -S -s smart '$wallpaper'" -}}
{{- $settings = $settings | setValueAtPath "Settings.backend" "awww" -}}
{{- $settings | toIni | replace "\"" "" -}}
{{- else -}}
[Settings]
post_command = wallswitch.sh -S -s smart "$wallpaper"
folder = ~/Pictures/Wallpaper
wallpaper = ~/Pictures/Wallpaper/default-bg.png
backend = awww
fill = stretch
swww_transition_type = fade
swww_transition_duration = 3
{{- end -}}
